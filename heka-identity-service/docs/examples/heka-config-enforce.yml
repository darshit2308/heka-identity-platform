# did:hedera:testnet:REPLACE_WITH_DEMO_ISSUER must be the demo tenant DID from POST /prepare-wallet.
version: 1
contributor_identity:
  mode: enforce
  trusted_issuers:
    - did:hedera:testnet:REPLACE_WITH_DEMO_ISSUER
  required_credentials:
    - GithubContributorCredential
  accepted_issuer_did_methods:
    - did:hedera
  presentation:
    format: dc+sd-jwt
    # Credential age since iat. 7776000 seconds is 90 days, the credential lifetime.
    # The 15-minute OID4VP session is presentation freshness and is not this field.
    max_age_seconds: 7776000
  grace_period:
    enabled: false
    days: 14
